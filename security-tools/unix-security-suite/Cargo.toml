[package]
name = "unix-security-suite"
version = "1.0.0"
edition = "2021"
description = "All five tilas01 security tools in a single binary, dispatched by subcommand."
authors = ["tilas01"]
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/tilas01/unix-guides-dynamic"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }

# Needed for the eframe::Result returned by each tool's start_gui(). Must stay
# on the same version as the tools themselves, or their Result type and ours are
# two different types and the dispatcher will not compile.
eframe = "0.27.2"

# The five tools are linked in directly, so this really is one binary that
# contains all of them rather than a launcher that shells out.
libre-otp      = { path = "../libre-otp" }
anti-ducky     = { path = "../anti-ducky" }
anti-evil-maid = { path = "../anti-evil-maid" }
kernel-watcher = { path = "../kernel-watcher" }
scarecrow      = { path = "../scarecrow" }

# Linked directly rather than relied on through the tools. Each of them calls
# harden_process() from its own main(), and this binary has its own main() and
# dispatches into their library functions — so without this dependency the
# all-in-one build is the one artefact in the suite that runs unhardened.
suite-hardening = { path = "../suite-hardening" }

# ─── Reproducible, optimised release builds ───────────────────────────────────
# Bit-for-bit reproducibility needs the build to contain nothing that varies
# between machines: no absolute paths, no timestamps, no host-specific codegen.
# The remaining requirements live in .cargo/config.toml (--remap-path-prefix)
# and in CI (SOURCE_DATE_EPOCH, --locked, a pinned toolchain).
[profile.release]
opt-level = 3
lto = "fat"           # whole-program optimisation across all five crates
codegen-units = 1     # required for determinism: parallel codegen is not stable
panic = "abort"       # smaller, and a security tool should not unwind past a fault
strip = "symbols"     # no local paths or symbol noise in the shipped binary
debug = false
incremental = false   # incremental artefacts are not reproducible
overflow-checks = true # keep arithmetic checks in release; correctness over speed
