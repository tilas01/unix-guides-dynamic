[package]
name = "anti-ducky"
version = "1.0.0"
edition = "2021"
description = "Intelligent USB HID Input Manager - detects, sandboxes, and alerts on RubberDucky/BadUSB payloads. Requires 2-of-N approved inputs to authorize a new device."

[lib]
name = "anti_ducky"
path = "src/lib.rs"

[[bin]]
name = "anti-ducky"
path = "src/main.rs"
[dependencies]
suite-hardening = { path = "../suite-hardening" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
eframe = "0.27.2"
egui = "0.27.2"

clap = { version = "4.5.4", features = ["derive"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rpassword = "7.2"

# The unlock PIN is stored as an Argon2id hash rather than compared against a
# constant in the source. Versions match the rest of the suite so the workspace
# resolves one copy of each.
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12.2"

[profile.release]
# Kept on across the suite: these parse untrusted input, and a silent integer
# wrap in a parser is how a length check stops being a length check.
overflow-checks = true
