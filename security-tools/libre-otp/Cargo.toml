[package]
name = "libre-otp"
version = "1.0.0"
edition = "2021"
description = "Native Rust OTP authenticator designed for PAM integration without proprietary backends."

[lib]
name = "libre_otp"
path = "src/lib.rs"

[[bin]]
name = "libre-otp"
path = "src/main.rs"

[dependencies]
suite-hardening = { path = "../suite-hardening" }
totp-rs = { version = "5.5.1", features = ["gen_secret"] }
rpassword = "7.3"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }

eframe = "0.27.2"
egui = "0.27.2"

clap = { version = "4.5.4", features = ["derive"] }

[profile.release]
# Kept on across the suite: these parse untrusted input, and a silent integer
# wrap in a parser is how a length check stops being a length check.
overflow-checks = true
