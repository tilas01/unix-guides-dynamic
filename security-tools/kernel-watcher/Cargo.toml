[package]
name = "kernel-watcher"
version = "1.0.0"
edition = "2024"

[dependencies]
suite-hardening = { path = "../suite-hardening" }
argon2 = "0.5.3"
notify = "8.2.0"
rand = "0.10.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rpassword = "7.5.4"
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
walkdir = "2.5.0"
hex = "0.4.3"
sha2 = "0.10"

eframe = "0.27.2"
egui = "0.27.2"
sysinfo = "0.39.3"
nix = { version = "0.31.3", features = ["signal", "process"] }
dialoguer = "0.12.0"
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.12.0"
aya-log = "0.2.0"

clap = { version = "4.5.4", features = ["derive"] }

[profile.release]
# Kept on across the suite: these parse untrusted input, and a silent integer
# wrap in a parser is how a length check stops being a length check.
overflow-checks = true
