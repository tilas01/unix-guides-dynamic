[package]
name = "anti-evil-maid"
version = "1.0.0"
edition = "2024"

[dependencies]
suite-hardening = { path = "../suite-hardening" }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
chrono = "0.4"
rpassword = "7.0"
kernel-watcher = { path = "../kernel-watcher" }

eframe = "0.27.2"
egui = "0.27.2"
udev = "0.9.3"
dialoguer = "0.12.0"

clap = { version = "4.5.4", features = ["derive"] }

# mlockall, for the LUKS suspend path. If the resume helper is paged out to a
# swap device that is also being suspended, the next instruction fetch blocks
# forever and the machine needs a power cycle.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "anti-evil-maid"
path = "src/main.rs"

[profile.release]
# Kept on across the suite: these parse untrusted input, and a silent integer
# wrap in a parser is how a length check stops being a length check.
overflow-checks = true
