name: Release Security Tools

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: one crate failing should not hide whether the others are
      # fine. With it on, a single error cancelled the rest and the failing job
      # appeared to move between runs, which made diagnosis harder than it needed
      # to be.
      fail-fast: false
      matrix:
        tool:
          - libre-otp
          - anti-ducky
          - anti-evil-maid
          - kernel-watcher
          - scarecrow
          - pi-boot-guard
          - aur-guard
          # The five daemons linked into one binary, for people who want the suite.
          # aur-guard stays standalone: it is a read-only reading aid that never
          # needs root, and bundling it with tools that do would be misleading.
          - unix-security-suite

    steps:
      - uses: actions/checkout@v4

      # Kept in step with security-tools/rust-toolchain.toml. Reproducibility
      # needs a fixed toolchain, but the pin must be at or above the dependency
      # floor (sysinfo 0.39 requires 1.95; two crates are edition 2024).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Install Ubuntu Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      # Derived from the commit, so a rebuild of the same commit gets the same
      # timestamp and therefore the same bytes.
      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      # Formatting is advisory (whitespace should not block a security release),
      # but clippy is a HARD gate: -D warnings means any lint finding fails the
      # build, so a release can only be produced from clippy-clean code. This is
      # the enforced answer to "audit all Rust errors and warnings" — a green run
      # is proof, not a claim.
      - name: Check formatting (advisory)
        continue-on-error: true
        run: cargo fmt --check || echo "::warning::cargo fmt reported differences"
        working-directory: security-tools/${{ matrix.tool }}

      # First thing that touches cargo, and it must be --locked.
      #
      # Three lockfiles (anti-ducky, unix-security-suite, scarecrow) had drifted
      # from their Cargo.toml: dependencies were declared and never resolved into
      # the lock. `cargo build --release --locked` below should have failed on
      # that — and did not, because the clippy step ran first *without* --locked,
      # silently re-resolved, and rewrote the lock. So --locked was being
      # satisfied by a file that step had just generated, not by the committed
      # one, and the released binaries were not built from the lock in the
      # repository. That is precisely the guarantee --locked exists to give.
      #
      # Every cargo invocation before the build now carries --locked, so a stale
      # lock fails loudly here instead of being quietly repaired.
      - name: Verify the committed Cargo.lock is complete
        run: cargo metadata --locked --format-version 1 > /dev/null
        working-directory: security-tools/${{ matrix.tool }}

      - name: Clippy (blocking, -D warnings)
        run: cargo clippy --all-targets --release --locked -- -D warnings
        working-directory: security-tools/${{ matrix.tool }}

      # Known vulnerabilities in the dependency tree, against the RustSec
      # database. Blocking.
      #
      # This was advisory for a while, on the reasoning that a newly published
      # advisory should not stop a security fix from shipping. That trade reads
      # differently for these crates: they parse untrusted input, hold
      # passphrases in memory and erase LUKS keyslots, and they are published as
      # signed binaries that people install to protect a machine. Shipping one
      # with a known-vulnerable dependency is the failure this project exists to
      # argue against.
      #
      # `--ignore` an advisory by id with a comment naming why, if one genuinely
      # cannot be acted on yet. That leaves a record; `continue-on-error` left
      # a warning nobody read.
      - name: Audit dependencies for known vulnerabilities
        run: |
          cargo install cargo-audit --locked --quiet 2>/dev/null || cargo install cargo-audit --locked
          cargo audit --deny warnings
        working-directory: security-tools/${{ matrix.tool }}

      # Licence policy, dependency sources and duplicates, against the shared
      # policy in security-tools/deny.toml. Blocking on licences and on sources
      # that are not crates.io; duplicates warn, and that file says why.
      #
      # An incompatible licence matters here because these are published as
      # binaries other people redistribute, which is not a decision this
      # project can make on their behalf.
      - name: Check dependency licences and sources
        run: |
          cargo install cargo-deny --locked --quiet 2>/dev/null || cargo install cargo-deny --locked
          cargo deny --all-features --config ../deny.toml check
        working-directory: security-tools/${{ matrix.tool }}

      # --locked so the committed Cargo.lock is honoured exactly; without it a
      # dependency could resolve differently and the build would not reproduce.
      - name: Build Release
        run: cargo build --release --locked
        working-directory: security-tools/${{ matrix.tool }}

      - name: Generate Hashes
        run: |
          cd security-tools/${{ matrix.tool }}/target/release
          sha512sum ${{ matrix.tool }} > ${{ matrix.tool }}.sha512
          sha256sum ${{ matrix.tool }} > ${{ matrix.tool }}.sha256
          echo "Built with $(rustc --version), SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          echo "Reproduce with: SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH cargo build --release --locked"

      # Signing is all-or-nothing on purpose. This step used to fall back to
      # writing the literal text "DUMMY SIG" into <tool>.sig and <tool>.asc when
      # the secret was absent, and those files were then published as release
      # assets. Anyone following the README's verification instructions would
      # have hit a bogus signature file while the docs claimed every binary was
      # signed. Now: sign properly, or publish hashes only and say so.
      - name: Generate GPG Signatures
        id: sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd "security-tools/${{ matrix.tool }}/target/release"
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not set - publishing SHA-256/512 hashes only, no signatures."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "${GPG_PASSPHRASE:-}" | gpg --batch --yes \
            --passphrase-fd 0 --pinentry-mode loopback \
            -u tilas01 --detach-sign --armor \
            --output "${{ matrix.tool }}.sig" "${{ matrix.tool }}"
          # verify-integrity.sh looks for .asc; keep both names for the same
          # armored detached signature.
          cp "${{ matrix.tool }}.sig" "${{ matrix.tool }}.asc"
          # Fail loudly rather than shipping a signature that does not verify.
          gpg --verify "${{ matrix.tool }}.sig" "${{ matrix.tool }}"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-release
          # if-no-files-found: ignore so an unsigned build (no .sig/.asc) still
          # uploads its binary and hashes instead of failing the whole job.
          if-no-files-found: ignore
          path: |
            security-tools/${{ matrix.tool }}/target/release/${{ matrix.tool }}
            security-tools/${{ matrix.tool }}/target/release/${{ matrix.tool }}.sha512
            security-tools/${{ matrix.tool }}/target/release/${{ matrix.tool }}.sha256
            security-tools/${{ matrix.tool }}/target/release/${{ matrix.tool }}.sig
            security-tools/${{ matrix.tool }}/target/release/${{ matrix.tool }}.asc

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      # The notes generator reads the repository (commit, tags, git log), so the
      # checkout is required and needs full history — fetch-depth: 1 would leave
      # `git describe` with no previous tag and silently produce a release whose
      # "Changes since" section is always empty.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Prepare Assets
        run: |
          mkdir -p final_release
          find release_assets -type f -exec cp {} final_release/ \;
          ls -la final_release/

      - name: Generate Tag
        id: tag
        run: |
          echo "tag=v$(date +'%Y.%m.%d-%H%M')-${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # Releases previously had no body at all — just a generic title and a pile
      # of unlabelled binaries. Someone landing on one had no way to tell what
      # any of the files were, how to check a signature, or what had changed.
      - name: Generate release notes
        run: |
          bash scripts/gen-release-notes.sh \
            "${{ steps.tag.outputs.tag }}" final_release > RELEASE_NOTES.md
          echo "--- generated notes ---"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Unix Security Suite ${{ steps.tag.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          files: final_release/*
          draft: false
          prerelease: ${{ github.ref_name == 'dev' }}
